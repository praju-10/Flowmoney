    <title>FlowMoney — Personal Finance</title>
    <script>
      // Marks phones so the compact phone layout applies ONLY there. Desktop and tablets are untouched.
      (function () {
        var q = '(max-width: 650px), (pointer: coarse) and (max-height: 500px)';
        var mq = window.matchMedia(q);
        function set() { document.documentElement.toggleAttribute('data-phone', mq.matches); }
        set();
        if (mq.addEventListener) mq.addEventListener('change', set); else mq.addListener(set);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
